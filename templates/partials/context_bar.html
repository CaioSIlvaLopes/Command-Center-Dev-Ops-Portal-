<div
    x-data="{
        canScrollLeft: false,
        canScrollRight: false,
        updateScrollState() {
            const el = this.$refs.track;
            if (!el) return;
            this.canScrollLeft = el.scrollLeft > 4;
            this.canScrollRight = (el.scrollLeft + el.clientWidth) < (el.scrollWidth - 4);
        },
        scrollTrack(offset) {
            const el = this.$refs.track;
            if (!el) return;
            el.scrollBy({ left: offset, behavior: 'smooth' });
            setTimeout(() => this.updateScrollState(), 260);
        },
        focusActiveWorkspace() {
            this.$nextTick(() => {
                const el = this.$refs.track;
                if (!el) return;
                const activeBtn = el.querySelector('[data-ws-active=&quot;true&quot;]');
                if (activeBtn && typeof activeBtn.scrollIntoView === 'function') {
                    activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
                this.updateScrollState();
                setTimeout(() => this.updateScrollState(), 250);
            });
        }
    }"
    x-init="focusActiveWorkspace()"
    @resize.window="updateScrollState()"
    @htmx:after-swap.window="focusActiveWorkspace()"
    class="flex flex-col lg:flex-row lg:items-center gap-2 w-full min-w-0"
>
    <!-- Bandeja Entalhada (.ds-layer-inset) Escalável com Botão Fixo 'Todas as Frentes', Setas Dinâmicas e Trilho Rolável -->
    <div class="flex items-center gap-1.5 px-2 ds-layer-inset ds-r-16 min-w-0 max-w-full flex-1">
        <!-- Botão Fixo à Esquerda: Todas as Frentes -->
        <div class="py-2 shrink-0">
            <button
                type="button"
                id="ws-pill-all"
                hx-get="{% url 'tasks:dashboard' %}?workspace=all&project={{ current_project_id }}&view={{ view_mode }}{% if view_mode == 'list' %}&sort={{ list_sort|default:'arrival_desc' }}&status_filter={{ list_status_filter|default:'active' }}{% endif %}{% if is_general_admin %}&user_filter={{ current_user_filter|default:'me' }}{% endif %}"
                hx-target="#dashboard-content"
                hx-swap="innerHTML"
                hx-push-url="true"
                class="shrink-0 whitespace-nowrap inline-flex items-center gap-1.5 px-3 py-1.5 ds-r-12 text-xs font-medium transition {% if current_workspace_slug == 'all' and not current_project %}ds-btn-primary font-semibold{% else %}ds-text-secondary hover:ds-text-primary{% endif %}"
            >
                <span>Todas as Frentes</span>
                <kbd class="hidden sm:inline-flex text-[10px] font-mono px-1 rounded opacity-80">Alt+0</kbd>
            </button>
        </div>

        <!-- Separador Sutil -->
        <span class="h-5 w-px shrink-0" style="background: var(--ds-border-subtle);"></span>

        <!-- Seta Dinâmica Esquerda (<) — Apenas Desktop quando houver scroll à esquerda -->
        <button
            type="button"
            x-show="canScrollLeft"
            x-cloak
            @click="scrollTrack(-220)"
            class="hidden md:inline-flex items-center justify-center w-7 h-7 ds-btn-tactile ds-r-8 text-xs font-mono shrink-0"
            title="Rolar Frentes para a esquerda"
            aria-label="Rolar Frentes para a esquerda"
        >
            &lt;
        </button>

        <!-- Trilho Rolável das Frentes (com respiro py-2 px-2 para não ceifar sombras neumórficas) -->
        <div
            x-ref="track"
            @scroll.passive="updateScrollState()"
            class="flex items-center flex-nowrap gap-2 overflow-x-auto no-scrollbar scroll-smooth py-2 px-2 min-w-0 flex-1"
        >
            {% for ws in workspaces %}
            <button
                type="button"
                id="ws-pill-{{ forloop.counter }}"
                data-ws-slug="{{ ws.slug }}"
                data-ws-active="{% if current_workspace_slug == ws.slug %}true{% else %}false{% endif %}"
                hx-get="{% url 'tasks:dashboard' %}?workspace={{ ws.slug }}&project={{ current_project_id }}&view={{ view_mode }}{% if view_mode == 'list' %}&sort={{ list_sort|default:'arrival_desc' }}&status_filter={{ list_status_filter|default:'active' }}{% endif %}{% if is_general_admin %}&user_filter={{ current_user_filter|default:'me' }}{% endif %}"
                hx-target="#dashboard-content"
                hx-swap="innerHTML"
                hx-push-url="true"
                class="shrink-0 whitespace-nowrap inline-flex items-center gap-1.5 px-3 py-1.5 ds-r-12 text-xs font-medium transition {% if current_workspace_slug == ws.slug %}{% if ws.is_orange_accent %}ds-btn-urgent font-semibold{% else %}ds-btn-primary font-semibold{% endif %}{% else %}ds-text-secondary hover:ds-text-primary{% endif %}"
            >
                <span class="h-2 w-2 rounded-full shrink-0" style="background: {% if current_workspace_slug == ws.slug %}#ffffff{% elif ws.is_orange_accent %}var(--ds-accent-secondary){% else %}var(--ds-accent-primary){% endif %};"></span>
                <span>{{ ws.name }}</span>
                <span class="text-[10px] font-mono opacity-80">({{ ws.active_count }})</span>
                {% if ws.shortcut_key %}
                <kbd class="hidden sm:inline-flex text-[10px] font-mono px-1 rounded opacity-75">{{ ws.shortcut_key }}</kbd>
                {% endif %}
            </button>
            {% endfor %}
        </div>

        <!-- Seta Dinâmica Direita (>) — Apenas Desktop quando houver scroll à direita -->
        <button
            type="button"
            x-show="canScrollRight"
            x-cloak
            @click="scrollTrack(220)"
            class="hidden md:inline-flex items-center justify-center w-7 h-7 ds-btn-tactile ds-r-8 text-xs font-mono shrink-0"
            title="Rolar Frentes para a direita"
            aria-label="Rolar Frentes para a direita"
        >
            &gt;
        </button>
    </div>

    {% if is_general_admin %}
    <!-- Seletor Tátil Compacto de Filtro de Usuário (Exclusivo Admin Geral) -->
    <div class="flex items-center justify-between sm:justify-start gap-2 px-3 py-2 ds-layer-inset ds-r-12 shrink-0 min-w-0">
        <span class="text-[10px] font-mono uppercase tracking-wider ds-urgent-text font-bold shrink-0">
            Fila:
        </span>
        <select
            id="admin-user-filter-select"
            name="user_filter"
            hx-get="{% url 'tasks:dashboard' %}?workspace={{ current_workspace_slug|default:'all' }}&project={{ current_project_id }}&view={{ view_mode|default:'focus' }}{% if view_mode == 'list' %}&sort={{ list_sort|default:'arrival_desc' }}&status_filter={{ list_status_filter|default:'active' }}{% endif %}"
            hx-trigger="change"
            hx-target="#dashboard-content"
            hx-swap="innerHTML"
            hx-push-url="true"
            class="bg-transparent text-xs font-mono font-semibold ds-text-primary focus:outline-none cursor-pointer truncate min-w-0 max-w-[200px] sm:max-w-[230px]"
            title="Filtrar tarefas por usuário (Exclusivo Admin Geral)"
        >
            <option value="me" class="ds-bg-surface ds-text-primary" {% if current_user_filter == 'me' or not current_user_filter %}selected{% endif %}>
                Minhas Tarefas
            </option>
            <option value="all" class="ds-bg-surface ds-text-primary" {% if current_user_filter == 'all' %}selected{% endif %}>
                Todos os Usuários
            </option>
            {% for u in filterable_users %}
            <option value="{{ u.id }}" class="ds-bg-surface ds-text-primary" {% if current_user_filter == u.id|stringformat:"s" %}selected{% endif %}>
                {% if u.team_profile %}{{ u.team_profile.name }} (@{{ u.team_profile.handle }}){% else %}{{ u.get_full_name|default:u.username }} (@{{ u.username }}){% endif %}
            </option>
            {% endfor %}
        </select>
    </div>
    {% endif %}
</div>
