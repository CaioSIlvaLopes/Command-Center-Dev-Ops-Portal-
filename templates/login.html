{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" data-theme="tactile-dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso Restrito &mdash; Command Center (Dev &amp; Ops Portal)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/tactile-ds.css' %}" />
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('cc-tactile-theme') || 'tactile-dark';
                document.documentElement.setAttribute('data-theme', saved);
            } catch (e) {}
        })();
    </script>
</head>
<body class="ds-app-body min-h-screen flex items-center justify-center p-4">
    <main class="w-full max-w-md ds-layer-raised ds-r-24 p-6 sm:p-8 space-y-6">
        <!-- Branding Tátil -->
        <div class="flex items-center justify-between border-b pb-4" style="border-color: var(--ds-border-subtle);">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 ds-layer-inset ds-r-12 flex items-center justify-center ds-accent-text font-mono font-bold text-base">
                    &gt;_
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-tight ds-text-primary">
                        COMMAND CENTER
                    </h1>
                    <p class="text-[11px] font-mono uppercase tracking-widest ds-accent-text">
                        Single-Tenant Ops Guard
                    </p>
                </div>
            </div>
            <span class="ds-badge ds-badge-urgent">&#128274; AUTH</span>
        </div>

        {% if form.errors %}
        <div class="ds-layer-inset ds-r-12 p-3 text-xs font-mono ds-urgent-text">
            Credenciais inválidas. Verifique seu usuário e senha.
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next|default:'/' }}" />

            <div>
                <label for="id_username" class="block text-[10px] font-mono uppercase ds-text-secondary mb-1.5">
                    Usuário Administrativo
                </label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    required
                    autofocus
                    autocomplete="username"
                    placeholder="Ex: caio"
                    class="w-full ds-input ds-layer-inset ds-r-12 px-3.5 py-2.5 text-xs font-mono ds-text-primary placeholder-[#94a3b8] focus:outline-none"
                />
            </div>

            <div>
                <label for="id_password" class="block text-[10px] font-mono uppercase ds-text-secondary mb-1.5">
                    Senha de Acesso
                </label>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    required
                    autocomplete="current-password"
                    placeholder="••••••••••••"
                    class="w-full ds-input ds-layer-inset ds-r-12 px-3.5 py-2.5 text-xs font-mono ds-text-primary placeholder-[#94a3b8] focus:outline-none"
                />
            </div>

            <div class="pt-2">
                <button
                    type="submit"
                    class="w-full py-2.5 px-4 ds-btn-primary ds-r-12 text-xs font-mono font-bold uppercase tracking-wider"
                >
                    Entrar no Command Center &rarr;
                </button>
            </div>
        </form>

        <div class="pt-3 border-t flex items-center justify-between text-[11px] font-mono ds-text-secondary" style="border-color: var(--ds-border-subtle);">
            <span>Tactile Soft UI &bull; Django 5</span>
            <span>Porta 8005 &bull; VPS Ready</span>
        </div>
    </main>
</body>
</html>
